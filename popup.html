<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: sans-serif; width: 280px; padding: 10px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .toggle-row h3 { margin: 0; }
    .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background-color: #ccc; transition: 0.15s; border-radius: 21px; cursor: pointer; }
    .switch .slider::before { position: absolute; content: ""; height: 15px; width: 15px; left: 3px; bottom: 3px; background-color: #fff; transition: 0.15s; border-radius: 50%; }
    .switch input:checked + .slider { background-color: #1f883d; }
    .switch input:checked + .slider::before { transform: translateX(17px); }
    textarea { width: 100%; height: 100px; box-sizing: border-box; font-family: monospace; font-size: 12px; }
    button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
    p { font-size: 11px; color: #666; }
    #status { font-size: 11px; color: green; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="toggle-row">
    <h3>Auto-hide enabled</h3>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>
  <h3>Auto-hide file patterns</h3>
  <p>One glob per line, e.g. <code>*.spec.ts</code></p>
  <textarea id="patterns"></textarea>
  <br />
  <button id="save">Save</button>
  <span id="status"></span>
  <script src="popup.js"></script>
</body>
</html>
